name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visualizer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visualizer/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The shipped Content-Security-Policy. Nothing else can check it: vite
      # neither reads public/_headers nor sends it, so the policy that lands in
      # production is invisible to the dev server, to vite preview and to every
      # unit test. This serves dist/ with the header file's rules applied, loads
      # the app under the policy and fails on any refusal. ubuntu-latest ships
      # Chrome, so nothing needs installing.
      - name: Check the shipped Content-Security-Policy
        run: npm run check:csp

      # Every preset mounts and draws without a console or GL error. A GLSL
      # compile or link failure is why this needs a browser: three.js reports it
      # with console.error and keeps drawing a black frame, so nothing throws and
      # no other step here can see it. It compares no frames, so there is nothing
      # to regenerate when a preset's look changes on purpose. ubuntu-latest has
      # no GPU, which is the renderer a shader bug like this hides from.
      - name: Smoke every preset
        run: npm run check:presets
