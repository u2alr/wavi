[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Matches .github/workflows/ci.yml and the README's Node 22 requirement.
  NODE_VERSION = "22"

# The API proxy is declared *before* the SPA catch-all: `/*` below matches every
# path, so a rule listed after it would never be reached in production while
# still working under the dev server's vite proxy.
[[redirects]]
  from = "/api/canvas"
  to = "https://spotify-canva.vercel.app/api/canvas"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hardening. The CSP ships as report-only on purpose: the app reaches out to
# Spotify's SDK, its Web API and lrclib.net, and a policy that is one origin
# short kills playback with no visible cause. Load the site once with lyrics and
# a Spotify connect, check the console for violations, then rename the header to
# Content-Security-Policy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' https://sdk.scdn.co; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://i.scdn.co https://mosaic.scdn.co; media-src 'self' blob:; connect-src 'self' https://api.spotify.com https://accounts.spotify.com https://lrclib.net; frame-src 'self' https://sdk.scdn.co"