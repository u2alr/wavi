<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Without this the phone renders at ~980px and every responsive/pointer
       rule in styles/ never matches. -->
  <!-- viewport-fit=cover is what makes the env(safe-area-inset-*) padding in
       theme.css resolve on notched phones. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta
    name="description"
    content="wavi is a browser music visualizer: WebGL shader presets, synced lyrics and Spotify playback in one window."
  />
  <meta name="theme-color" content="#8ACE00" />
  <meta property="og:title" content="wavi — music visualizer" />
  <meta property="og:description" content="WebGL visualizer with synced lyrics and Spotify playback." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238ACE00'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='18' font-weight='bold' text-anchor='middle' fill='%231a2400'%3Ew%3C/text%3E%3C/svg%3E" />
  <title>wavi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
